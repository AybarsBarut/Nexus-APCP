# TASK_PROGRESS.yaml
# Copy-safe starter template.
# Replace placeholders after installing Nexus-APCP in a project.
# Do not preserve Nexus-APCP source-repository maintenance history here.

project:
  name: "[PROJECT_NAME]"
  status: "INITIALIZING"
  version: "0.1.0"
  repository_visibility: "[public|private|internal]"
  last_updated: "[YYYY-MM-DD HH:MM:SS UTC]"

active_sprint:
  name: "Sprint 1: [SPRINT_NAME]"
  goal: "[SPRINT_GOAL]"
  start_date: "[YYYY-MM-DD]"
  end_date: "[YYYY-MM-DD]"

tasks:
  - id: "TASK-001"
    title: "[FIRST_TASK_TITLE]"
    status: "NOT_STARTED"
    priority: "HIGH"
    effort: "[ESTIMATE]"
    assignee: "[OWNER_OR_AI_AGENT]"
    description: "[TASK_DESCRIPTION]"
    acceptance_criteria:
      - "[VERIFIABLE_OUTCOME]"
    dependencies: []
    notes: []

checkpoints:
  context_loaded: false
  plan_approved: false
  implementation_verified: false
  user_acceptance: false

metrics:
  tasks_completed: 0
  total_tasks: 1
  velocity: 0.0
  quality_score: null

handoff:
  last_session_summary: "[WHAT_CHANGED_LAST]"
  next_action: "[NEXT_ACTION]"
  blockers: []
